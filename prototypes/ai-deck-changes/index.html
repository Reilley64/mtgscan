<style>

.pbtn{width:22px;height:15px;border-radius:4px;background:var(--surface3);font-size:8px;line-height:15px;color:#fff}
.pbtn:disabled{opacity:.25;cursor:not-allowed}
.btn.simscan{flex:none;width:100%;background:rgba(0,0,0,.5);border:1px dashed #ffb300;color:#ffb300}
#switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:4px;background:#ffffff;color:#111;border-radius:999px;padding:5px;box-shadow:0 8px 30px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.2);font-weight:800;font-size:13px}
#switcher button{width:34px;height:34px;border-radius:17px;background:#eee;color:#111;font-size:16px;font-weight:900}
#switcher button:hover{background:#ddd}
#switcher .label{padding:0 12px;min-width:220px;text-align:center}
#layout-switcher{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:4px;background:#fff4d6;color:#1a1200;border-radius:999px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.2);font-weight:800;font-size:12px}

#layout-switcher button:hover{background:#ebd69a}
#layout-switcher .label{padding:0 10px;min-width:220px;text-align:center}
#dev{position:fixed;top:14px;left:14px;z-index:100;width:280px;background:#f4f1e8;color:#1a1a1a;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:12px;overflow:hidden}
#dev .dh{background:#ffb300;color:#1a1200;padding:7px 10px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
#dev .db{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
#dev .db.hidden{display:none}
#dev button{background:#fff;border:1px solid #c9c2ad;border-radius:6px;padding:5px 8px;color:#1a1a1a;font-weight:700;text-align:left}
#dev button:hover{background:#fffbe9}
#dev select{width:100%;font:inherit;padding:4px;border-radius:6px;border:1px solid #c9c2ad;background:#fff;color:#1a1a1a}
#dev .grp{border-top:1px solid #ddd5bd;padding-top:6px;display:flex;flex-direction:column;gap:5px}
#dev .grp .t{font-weight:800;color:#6b5a1d;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
#dev .btns{display:flex;flex-wrap:wrap;gap:4px}
#dev label{display:flex;gap:6px;align-items:center}
#state-panel{position:fixed;top:14px;right:14px;width:min(460px,calc(50vw - 230px));height:calc(100vh - 100px);background:#0e1113;border-radius:14px;border:1px solid #3b4246;overflow:auto;font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfe3ea}
#state-panel[hidden]{display:none}
#state-panel .sh{position:sticky;top:0;background:#0e1113;padding:8px 12px;border-bottom:1px solid #2a3135;color:#ffb300;font-weight:800;font-family:-apple-system,system-ui,sans-serif;font-size:12px;display:flex;justify-content:space-between}
#state-panel pre{margin:0;padding:10px 12px;white-space:pre-wrap;word-break:break-word}
</style>

  const deckById = (s, id) => s.decks.find(d => d.id === id);
  const entryById = (s, id) => s.collection.find(e => e.id === id);
  const card = id => CATALOG[id];
  const rank = p => PRIORITY_RANK[p];

  function deckCards(s, d) {
    const out = d.commanders.map(c => ({ cardId: c, qty: 1, commander: true }));
    for (const r of d.rows) { const e = entryById(s, r.entryId); if (e) out.push({ cardId: e.cardId, qty: r.qty, entryId: r.entryId, rowId: r.id }); }

  const copiesOf = (s, cardId) => s.collection.filter(e => e.cardId === cardId).map(e => ({

  function copySummary(s, cardId) {

      free: sum(c => c.entry.protected ? 0 : c.free),

  function promotionOutcome(s, sugId) {

  function validityOfList(s, list) {
    const commanders = list.filter(x => x.commander);

    const off = list.filter(x => x.cardId && !x.commander && card(x.cardId).ci.split('').some(c => c && !colors.has(c)));

  function bracketOfList(list) {

    else signals.push({ label: `${gcs.length} Game Changers`, source: 'official', min: 4, cards: gcs });

  function deckChangesOf(s, deckId) { return s.changes.filter(c => c.deckId === deckId); }

  function revertPlan(s, changeId) {
    const target = s.changes.find(c => c.id === changeId);

    const add = (x, n) => {
      const key = x.entryId || x.cardId;
      const cur = net.get(key) || { cardId: x.cardId, entryId: x.entryId || null, qty: 0 };
      cur.qty += n; net.set(key, cur);
    };

    const ins = [], outs = [], blockers = [], held = [];
    for (const x of net.values()) {
      if (x.qty < 0) outs.push({ ...x, qty: -x.qty });

      ins.push(x);

  function event(s, deckId, kind, extra = {}) { s.events.push({ id: nextId(s, 'v'), at: s.clock, deckId, kind, ...extra }); }

  function unprotectOne(s, e) {
    let twin = s.collection.find(x => x.id !== e.id && x.cardId === e.cardId && x.printing === e.printing && x.finish === e.finish && x.language === e.language && x.condition === e.condition && !x.protected);

    if (!twin) { twin = { ...e, id: nextId(s, 'e'), qty: 0, protected: toProtected }; s.collection.push(twin); }
    e.qty -= 1; twin.qty += 1;
    const holds = heldSwaps(s, e.id);
    for (const h of holds.slice(Math.max(0, e.qty - allocatedQty(s, e.id)))) h.heldEntryId = twin.id;
    if (e.qty <= 0) s.collection = s.collection.filter(x => x.id !== e.id);

  }

  function settle(s, deckId) {
    const d = deckById(s, deckId);

    for (const p of s.plannedSwaps) if (p.deckId === deckId && p.status === 'open' && p.out && !deckHas(s, d, p.out)) { p.status = 'closed'; p.note = 'outgoing card left the deck'; event(s, deckId, 'closed', { swapId: p.id }); }
    for (const b of s.buylist) if (b.deckId === deckId && b.status === 'open' && b.out && !deckHas(s, d, b.out)) { b.status = 'closed'; b.note = 'outgoing card left the deck'; event(s, deckId, 'closed', { buylistId: b.id }); }
  }

  function applyDeckChange(s, deckId, ins, outs, meta) {
    const d = deckById(s, deckId);
    const recIn = [], recOut = [];
    for (const o of outs) {
      if (card(o.cardId).basic) { d.basics[o.cardId] = Math.max(0, (d.basics[o.cardId] || 0) - o.qty); recOut.push({ cardId: o.cardId, qty: o.qty }); continue; }

        const take = Math.min(left, r.qty); r.qty -= take; left -= take;
        recOut.push({ cardId: o.cardId, entryId: r.entryId, qty: take });
      }
      d.rows = d.rows.filter(r => r.qty > 0);
    }
    for (const i of ins) {
      if (card(i.cardId).basic) { d.basics[i.cardId] = (d.basics[i.cardId] || 0) + i.qty; recIn.push({ cardId: i.cardId, qty: i.qty }); continue; }
      let e = entryById(s, i.entryId);
      if (e.protected) { e = unprotectOne(s, e); event(s, deckId, 'unprotected', { cardId: i.cardId }); }
      const row = d.rows.find(r => r.entryId === e.id);
      if (row) row.qty += i.qty; else d.rows.push({ id: nextId(s, 'r'), entryId: e.id, qty: i.qty });
      recIn.push({ cardId: i.cardId, entryId: e.id, qty: i.qty });

  function reducer(state, action) {

    const s = clone(state);
    const sug = action.id ? s.suggestions.find(x => x.id === action.id) : null;
    switch (action.type) {

        }

        s.buylist.push(b);
        sug.status = 'promoted'; sug.result = { kind: 'buylist card', id: b.id };
        event(s, sug.deckId, 'buylist card', { buylistId: b.id, suggestionId: sug.id });
        return s;
      }
      case 'dismiss': {
        if (!sug || sug.status !== 'open') return state;
        tick(s); sug.status = 'dismissed';
        event(s, sug.deckId, 'dismissed', { suggestionId: sug.id });
        return s;

let lastUiEvent = 'load';

function render() {
  const screen = document.getElementById('screen');
  const scrolls = {};
  screen.querySelectorAll('[data-scroll]').forEach(el => { scrolls[el.dataset.scroll] = el.scrollTop; });
  const view = ui.variant === 'A' ? renderA() : ui.variant === 'B' ? renderB() : ui.variant === 'C' ? renderC() : renderD();
  screen.classList.toggle('camera', ui.variant === 'D' && ui.D.tab === 'scan');
  screen.innerHTML = `${statusBar()}<div class="app ${ui.sheet ? 'under-sheet' : ''}">${view}</div>${renderSheet()}${ui.toast ? `<div class="toast">${esc(ui.toast)}</div>` : ''}<div class="homebar"></div>`;
  screen.querySelectorAll('[data-scroll]').forEach(el => {
    if (el.dataset.bottom && ui.C.toBottom) { el.scrollTop = el.scrollHeight; return; }
    if (scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll];
  });
  ui.C.toBottom = false;
  if (ui.C.highlight && ui.variant === 'C') { const t = screen.querySelector(`.ev.hl`); if (t) t.scrollIntoView({ block: 'center' }); }
  document.getElementById('dev').innerHTML = renderDev();
  renderLayoutSwitcher();
  document.getElementById('switcher-label').textContent = `${ui.variant} · ${VARIANTS.find(v => v[0] === ui.variant)[1]}`;
  document.title = `PROTOTYPE · ${ui.variant} ${VARIANTS.find(v => v[0] === ui.variant)[1]} · AI deck changes (#18) · mtgscan`;
  renderStatePanel();
}

function layoutKind() {
  if (ui.variant !== 'D') return null;
  if (ui.D.tab === 'collection') return 'collection';
  if (ui.D.tab === 'decks' && !ui.D.deckId) return 'decks';
  return null;
}
function renderLayoutSwitcher() {
  const el = document.getElementById('layout-switcher');
  const kind = layoutKind();
  el.hidden = !kind;
  if (!kind) return;
  el.dataset.kind = kind;
  const n = ui.layout[kind];
  const names = kind === 'collection' ? COL_LAYOUTS : DECK_LAYOUTS;
  document.getElementById('layout-label').textContent = `${kind === 'collection' ? 'Collection' : 'Decks'} layout ${n} of ${names.length} · ${names[n - 1]}`;
}
function toast(msg) {
  ui.toast = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { ui.toast = null; render(); }, 2600);
}
function dispatch(action, okMsg) {
  const prev = state;
  state = D.reducer(state, action);
  lastAction = action.type + (action.id ? ' ' + action.id : action.changeId ? ' ' + action.changeId : '');
  if (state === prev) toast('Nothing changed.');
  else if (okMsg) toast(typeof okMsg === 'function' ? okMsg(prev) : okMsg);
  return state !== prev;
}
function newest(list, prev, key) { return list.find(x => !prev[key].some(y => y.id === x.id)); }

const handlers = {
  pickDeck: ds => { ui.deckId = ds.deck; },
  pickDeckC: ds => { ui.deckId = ds.deck; ui.C.toBottom = true; ui.C.revertFrom = null; ui.C.highlight = null; },
  openHistory: ds => { ui.sheet = { type: 'history', deckId: ds.deck }; },
  toggleClosedA: () => { ui.A.showClosed = !ui.A.showClosed; },
  dismiss: ds => { dispatch({ type: 'dismiss', id: ds.id }, 'Deck suggestion dismissed.'); },
  openPromote: ds => { ui.sheet = { type: 'promote', id: ds.id, entryId: null }; },
  pickEntry: ds => { ui.sheet = { ...ui.sheet, entryId: ds.entry }; },
  promote: ds => {
    const s = sugOf(ds.id);
    dispatch({ type: 'promote', id: ds.id, entryId: ds.entry, toBuylist: !!ds.buylist }, () => {
      const r = sugOf(ds.id).result;
      return r ? (r.kind === 'deck change' ? `${C(s.in).name} added to ${deckOf(s.deckId).short} as a deck change.` : `${cap(r.kind)} created for ${deckOf(s.deckId).short}.`) : 'Promoted.';
    });
    ui.sheet = null;
  },
  openPair: ds => {
    const p = sugOf(ds.id);
    ui.sheet = null;
    if (ui.variant === 'A') { ui.deckId = p.deckId; }
    if (ui.variant === 'B') { ui.B.filter = 'all'; ui.B.current = p.id; ui.B.tab = 'review'; ui.B.skipped = ui.B.skipped.filter(x => x !== p.id); }
    if (ui.variant === 'C') { ui.deckId = p.deckId; ui.C.filter = 'all'; ui.C.highlight = p.id; }
    if (ui.variant === 'D') { ui.D.tab = 'decks'; ui.D.deckId = p.deckId; }
    if (p.status !== 'open' && p.result && p.result.kind === 'planned swap') toast(`The paired suggestion is now a planned swap in ${deckOf(p.deckId).short}.`);
  },
  swapIn: ds => {
    const p = swapOf(ds.id);
    const e = D.entryById(state, p.heldEntryId);
    if (e && e.protected) { ui.sheet = { type: 'swapIn', id: ds.id }; return; }
    dispatch({ type: 'swapIn', id: ds.id }, `Swapped in ${C(p.in).name}. Deck change added to the history.`);
  },
  swapInConfirm: ds => { const p = swapOf(ds.id); dispatch({ type: 'swapIn', id: ds.id }, `Swapped in ${C(p.in).name} and unprotected the copy.`); ui.sheet = null; },
  openBought: ds => { ui.sheet = { type: 'bought', id: ds.id, entryId: null }; },
  simScan: ds => { dispatch({ type: 'simulateScan', cardId: ds.card, deckId: ds.deck }, `Scanned copies of ${C(ds.card).name} into the collection.`); ui.sheet = { ...ui.sheet, entryId: null }; },
  bought: ds => { const x = buyOf(ds.id); dispatch({ type: 'bought', id: ds.id, entryId: ds.entry }, `${C(x.in).name} is in ${deckOf(x.deckId).short}. Buylist card closed.`); ui.sheet = null; },
  openRevert: ds => { ui.sheet = { type: 'revert', changeId: ds.change, back: ui.sheet && ui.sheet.type === 'history' ? ui.sheet : null }; },
  backSheet: () => { ui.sheet = ui.sheet.back; },
  confirmRevert: ds => {
    const plan = D.revertPlan(state, ds.change);
    dispatch({ type: 'revert', changeId: ds.change, confirmHeld: true }, `Reverted ${plural(plan.undo.length, 'change')} in ${plan.deck.short}.${plan.held.length ? ' A planned swap moved to the buylist.' : ''}`);
    if (ui.sheet && ui.sheet.back) ui.sheet = ui.sheet.back; else ui.sheet = null;
    ui.C.revertFrom = null;
  },
  revertFromC: ds => { ui.C.revertFrom = ds.change; },
  cancelRevertC: () => { ui.C.revertFrom = null; },
  filterC: ds => { ui.C.filter = ds.f; ui.C.toBottom = true; },
  openDeckInfo: ds => { ui.sheet = { type: 'deckInfo', deckId: ds.deck }; },
  tabB: ds => { ui.B.tab = ds.tab; },
  filterB: ds => { ui.B.filter = ds.deck; ui.B.current = null; },
  skipB: ds => { ui.B.skipped = [...ui.B.skipped.filter(x => x !== ds.id), ds.id]; const q = queueB(); ui.B.current = q[0] ? q[0].id : null; },
  historyDeckB: ds => { ui.B.deckId = ds.deck; },
  closeSheet: () => { ui.sheet = null; },
  reset: () => { clearTimeout(scanTimer); state = D.seed(); lastAction = 'reset'; Object.assign(ui, freshUi()); toast('Data reset.'); },
  toggleState: () => { ui.showState = !ui.showState; },
  toggleImages: () => { ui.images = !ui.images; },
  toggleDev: () => { ui.devOpen = !ui.devOpen; },
  aiWithdraw: () => { const s = sugOf(ui.devTarget); if (s) dispatch({ type: 'aiWithdraw', id: s.id }, `ChatGPT withdrew the suggestion for ${C(s.in).name}.`); },
  aiEditReason: () => { const s = sugOf(ui.devTarget); if (s) dispatch({ type: 'aiEditReason', id: s.id }, `ChatGPT edited the reason for ${C(s.in).name}.`); },
  aiNew: () => {
    const prev = state;
    dispatch({ type: 'aiNewSuggestion' });
    const n = newest(state.suggestions, prev, 'suggestions');
    if (n) { toast(`ChatGPT suggested ${C(n.in).name} for ${deckOf(n.deckId).short}.${n.status === 'stale' ? ' It is already stale.' : ''}`); if (ui.variant === 'C' && ui.deckId === n.deckId) ui.C.toBottom = true; }
  },
  tabD: ds => { if (ds.tab === 'decks' && ui.D.tab === 'decks') ui.D.deckId = null; ui.D.tab = ds.tab; },
  filterD: ds => { ui.D.filter = ds.f; },
  openDeckD: ds => { ui.sheet = null; ui.D.tab = 'decks'; ui.D.deckId = ds.deck; ui.deckId = ds.deck; },
  backDecksD: () => { ui.D.deckId = null; },
  colFilterD: ds => { ui.D.colFilter = ds.f; },
  openEntryD: ds => { ui.sheet = { type: 'entry', entryId: ds.entry }; },
  protectD: ds => { protectToggle(ds.entry, 'protectCopy'); },
  unprotectD: ds => { protectToggle(ds.entry, 'unprotectCopy'); },
  goScanD: ds => { const x = buyOf(ds.id); ui.D.scanFor = { buylistId: x.id, cardId: x.in, returnTab: ui.D.tab }; ui.sheet = null; ui.D.tab = 'scan'; },
  cancelScanForD: () => { ui.D.scanFor = null; },
  simScanD: () => {
    if (ui.D.scanning) return;
    ui.D.scanning = true;
    const sf = ui.D.scanFor;
    const cardId = sf && !state.scanBatch.some(x => x.cardId === sf.cardId) ? sf.cardId : undefined;
    clearTimeout(scanTimer);
    scanTimer = setTimeout(() => { ui.D.scanning = false; lastUiEvent = 'scanRecognized'; dispatch({ type: 'scanCard', cardId }); render(); }, 800);
  },
  openBatchD: () => { ui.sheet = { type: 'batch' }; },
  removeBatchD: ds => { dispatch({ type: 'removeBatchCopy', itemId: ds.item }); },
  addBatchD: () => {
    const n = state.scanBatch.reduce((a, x) => a + x.qty, 0);
    if (!dispatch({ type: 'addBatch' }, `Added ${n === 1 ? '1 copy' : n + ' copies'} to your collection.`)) return;
    ui.sheet = null;
    const sf = ui.D.scanFor;
    if (sf && buyOf(sf.buylistId).status === 'open' && D.copiesOf(state, sf.cardId).some(c => c.free > 0)) {
      ui.D.scanFor = null; ui.D.tab = sf.returnTab || 'recent';
      ui.sheet = { type: 'bought', id: sf.buylistId, entryId: null };
    }
  },
  layoutD: ds => {
    const kind = layoutKind();
    if (!kind) return;
    ui.layout[kind] = (ui.layout[kind] - 1 + Number(ds.step) + 3) % 3 + 1;
    setParam(kind, ui.layout[kind]);
  },
  cardSortD: ds => { ui.D.cardSort = ds.sort; },
  toggleCardD: ds => { ui.D.expanded = ui.D.expanded.includes(ds.card) ? ui.D.expanded.filter(x => x !== ds.card) : [...ui.D.expanded, ds.card]; },
  deckSortD: ds => { const s = ui.D.deckSort; ui.D.deckSort = s.key === ds.key ? { key: s.key, dir: -s.dir } : { key: ds.key, dir: ds.key === 'name' ? 1 : -1 }; },
  priorityD: ds => {
    const d = deckOf(ds.deck), order = ['low', 'medium', 'high'];
    const to = order[order.indexOf(d.priority) + Number(ds.dir)];
    if (to) dispatch({ type: 'setPriority', deckId: d.id, priority: to }, `${d.short} is now ${to} priority.`);
  },
  toggleGap: () => { dispatch({ type: 'toggleCatalogGap' }, state.catalogGap ? 'Catalog record restored.' : 'Siege-Gang Commander now has no catalog record.'); }
};

function protectToggle(entryId, type) {
  const e = D.entryById(state, entryId);
  const props = { cardId: e.cardId, printing: e.printing, finish: e.finish, condition: e.condition, language: e.language, protected: !e.protected };
  if (!dispatch({ type, entryId }, type === 'protectCopy' ? `Protected 1 copy of ${C(e.cardId).name}.` : `Unprotected 1 copy of ${C(e.cardId).name}.`)) return;
  const twin = state.collection.find(x => Object.entries(props).every(([k, v]) => x[k] === v));
  if (twin) ui.sheet = { type: 'entry', entryId: twin.id };
}
function fit() { document.documentElement.style.setProperty('--fit', Math.min(1, (window.innerHeight - 150) / 870).toFixed(3)); }
window.addEventListener('resize', fit);
fit();
function setParam(k, v) {
  const p = new URLSearchParams(location.search); p.set(k, v);
  history.replaceState(null, '', `${location.pathname}?${p.toString()}${location.hash}`);
}
function setVariant(v) {
  ui.variant = v; ui.sheet = null; ui.C.revertFrom = null; ui.C.toBottom = true;
  setParam('variant', v);
  render();
}
function cycle(step) { const i = VARIANTS.findIndex(v => v[0] === ui.variant); setVariant(VARIANTS[(i + step + VARIANTS.length) % VARIANTS.length][0]); }

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = handlers[el.dataset.act];
  if (!fn) return;
  lastUiEvent = el.dataset.act;
  if (el.dataset.act === 'closeSheet' && el.classList.contains('sheet-scrim') && ev.target !== el) return;
  fn(el.dataset);
  render();
});
document.addEventListener('change', ev => { if (ev.target.id === 'dev-target') { ui.devTarget = ev.target.value; } });
document.addEventListener('input', ev => {
  if (ev.target.id !== 'col-search') return;
  const pos = ev.target.selectionStart;
  ui.D.query = ev.target.value;
  lastUiEvent = 'collectionSearch';
  render();
  const el = document.getElementById('col-search');
  el.focus();
  el.setSelectionRange(pos, pos);
});
document.addEventListener('keydown', ev => {
  const a = document.activeElement;
  const typing = a && (a.matches('input, textarea, select, [contenteditable], [contenteditable="true"]'));
  if (ev.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); return; }
  if (typing) return;
  if (ev.key === 'ArrowLeft') { ev.preventDefault(); cycle(-1); }
  if (ev.key === 'ArrowRight') { ev.preventDefault(); cycle(1); }
});
document.getElementById('prev').addEventListener('click', () => cycle(-1));
document.getElementById('next').addEventListener('click', () => cycle(1));
setVariant(ui.variant);

</script>
</body>
</html>
