<!doctype html>
<!--
PROTOTYPE, throwaway. Do not merge to main.
Question: what should the mtgscan sign-in screen look like? The PR #42 screen is too bare.
Plan: five radically different variants of the sign-in screen in one iPhone 17 Pro frame,
switchable with ?variant=A..E, the bottom pill, or the left and right arrow keys.
?state=idle|apple|google|failed|signedin also works, so a reload keeps the state.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>PROTOTYPE · Sign-in screen (#29) · mtgscan</title>
<style>
:root{--bg:#080b0d;--surface:#11171a;--surface2:#1a2125;--surface3:#232c31;--sheet:#161c1f;--line:#2a3238;--text:#fff;--muted:#b5c0c5;--dim:#7d8a90;--accent:#d8ff62;--on-accent:#101500;--danger:#ff7a70;--badge:#e0244a;--outline:#ff4fd8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#15181b;color:var(--text);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
#page{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:20px 24px 120px}
#phone{zoom:var(--fit,1);position:relative;width:402px;height:874px;border-radius:58px;background:var(--bg);box-shadow:0 0 0 10px #101315,0 0 0 12px #3c4246,0 30px 90px rgba(0,0,0,.6);overflow:hidden;flex:none}
#screen{position:absolute;inset:0;overflow:hidden}
.statusbar{position:absolute;top:0;left:0;right:0;height:62px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 46px;font-weight:700;font-size:16px;z-index:40;pointer-events:none}
.island{position:absolute;left:50%;top:11px;width:125px;height:37px;border-radius:20px;background:#000;transform:translateX(-50%)}
.sb-icons{display:flex;gap:6px;align-items:center}
.sig{display:flex;gap:2px;align-items:flex-end;height:11px}.sig i{width:3px;background:#fff;border-radius:1px}
.batt{width:25px;height:12px;border:1.5px solid rgba(255,255,255,.55);border-radius:4px;position:relative}
.batt:after{content:"";position:absolute;inset:1.5px;right:4px;background:#fff;border-radius:1.5px}
.homebar{position:absolute;bottom:8px;left:50%;width:140px;height:5px;border-radius:3px;background:#fff;transform:translateX(-50%);z-index:60;pointer-events:none}
.v{position:absolute;inset:0;display:flex;flex-direction:column}

/* shared brand and auth */
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.01em}
.brand .mark{width:18px;height:25px;border:2.5px solid var(--accent);border-radius:4px;flex:none}
.auth{display:flex;flex-direction:column;gap:10px}
.sbtn{position:relative;height:50px;width:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;letter-spacing:-.01em;transition:opacity .2s}
.sbtn .logo{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex:none}
.sbtn.apple{background:#fff;color:#000}
.sbtn.apple .logo svg{width:15px;height:18px;margin-top:-3px}
.sbtn.google{background:#131314;color:#e3e3e3;border:1px solid #8e918f;font-family:Roboto,-apple-system,"SF Pro Text",system-ui,sans-serif;font-weight:500;font-size:16px}
.sbtn:disabled{cursor:default}
.sbtn.off{opacity:.38}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fail{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.fail .msg{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px}
.fail .msg .dot{width:22px;height:22px;border-radius:11px;background:rgba(255,122,112,.16);color:var(--danger);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex:none}
.btn-primary{height:50px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:17px}
.legal{color:var(--dim);font-size:12px;text-align:center;margin-top:12px}
.legal a{color:var(--accent);font-weight:700;text-decoration:none}
.credit{color:var(--dim);font-size:10px;font-weight:600}
.credit a{text-decoration:none}

/* A card fan */
.vA{background:radial-gradient(120% 70% at 50% 28%,#1a2125 0%,#080b0d 60%)}
.vA .fan{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin-top:62px}
.vA .glow{position:absolute;width:260px;height:260px;border-radius:50%;background:center/cover;filter:blur(60px) saturate(1.4);opacity:.45}
.vA .fc{position:absolute;width:170px;aspect-ratio:488/680;border-radius:9px;background:#2a3238 center/cover;box-shadow:0 18px 40px rgba(0,0,0,.6);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.vA .fc.l{transform:translate(-84px,22px) rotate(-13deg)}
.vA .fc.r{transform:translate(84px,22px) rotate(13deg)}
.vA .fc.c{transform:translateY(-6px);z-index:2;animation:bob 6s ease-in-out infinite}
.vA.deal .fc{transform:translateY(-6px) rotate(0)}
@keyframes bob{50%{transform:translateY(-14px)}}
.vA .fancredit{position:absolute;bottom:4px;left:0;right:0;text-align:center}
.vA .copy{padding:8px 24px 0;text-align:center}
.vA .brand{font-size:34px}.vA .brand .mark{width:22px;height:31px}
.vA h1{font-size:20px;line-height:1.2;font-weight:800;margin:14px 0 6px}
.vA .sub{color:var(--muted);font-size:14px;margin:0 8px}
.vA .bottom{padding:24px 16px 40px}

/* B commander art */
.vB{background:#000}
.vB .art{position:absolute;inset:0;background-size:auto 100%;background-position:0% 50%;background-repeat:no-repeat;opacity:0;transition:opacity 1.6s;animation:kb 26s ease-in-out infinite alternate}
.vB .art.on{opacity:1}
@keyframes kb{from{background-position:10% 50%;transform:scale(1.04)}to{background-position:90% 50%;transform:scale(1.12)}}
.vB .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,11,13,.75) 0%,rgba(8,11,13,0) 18%,rgba(8,11,13,0) 38%,rgba(8,11,13,.85) 62%,#080b0d 80%)}
.vB .artcredit{position:absolute;top:66px;right:14px;z-index:3;display:flex;align-items:center;gap:6px;background:rgba(8,11,13,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;padding:4px 10px;font-size:11px;font-weight:700;color:#fff;max-width:300px}
.vB .artcredit span{color:var(--muted);font-weight:600}
.vB .content{position:relative;z-index:2;margin-top:auto;padding:0 20px 40px}
.vB .brand{font-size:44px;letter-spacing:-.02em}.vB .brand .mark{width:26px;height:36px;border-width:3px;border-radius:5px}
.vB h1{font-size:22px;line-height:1.2;font-weight:800;margin:10px 0 6px}
.vB .sub{color:var(--muted);margin:0 0 22px;font-size:14px}

/* C scanner demo */
.vC{background:#000}
.vC .cam{position:relative;height:530px;flex:none;overflow:hidden;background:radial-gradient(90% 70% at 50% 45%,#24201b 0%,#0d0c0a 70%,#000 100%)}
.vC .cam:after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 20%,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
.vC .batch{position:absolute;top:66px;right:16px;width:44px;height:44px;border-radius:22px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;z-index:5}
.vC .batch svg{width:22px;height:22px}
.vC .batch .cnt{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--badge);font-size:10px;font-weight:900;line-height:17px;text-align:center;transition:transform .2s}
.vC .batch .cnt.bump{transform:scale(1.35)}
.vC .batch .cnt:empty{display:none}
.vC .stage{position:absolute;left:50%;top:268px;width:200px;height:279px;margin:-140px 0 0 -100px;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s;transform:translateY(420px) rotate(8deg)}
.vC .stage .card{position:absolute;inset:0;border-radius:10px;background:#2a3238 center/cover;box-shadow:0 20px 40px rgba(0,0,0,.7)}
.vC .stage .ol{position:absolute;inset:-5px;border:3px solid var(--outline);border-radius:13px;opacity:0;transform:scale(1.18) rotate(3deg);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s;box-shadow:0 0 16px rgba(255,79,216,.45)}
.vC[data-ph=enter] .stage,.vC[data-ph=detect] .stage,.vC[data-ph=lock] .stage,.vC[data-ph=result] .stage{transform:translateY(0) rotate(-4deg)}
.vC[data-ph=idle] .stage{transition:none}
.vC[data-ph=exit] .stage{transform:translate(-340px,-40px) rotate(-18deg);opacity:0}
.vC[data-ph=detect] .ol{opacity:.75;animation:pulse .7s ease-in-out infinite}
.vC[data-ph=lock] .ol,.vC[data-ph=result] .ol{opacity:1;transform:none}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.vC .chipwrap{position:absolute;left:12px;right:12px;bottom:12px;z-index:5}
.vC .lchip{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:8px 16px 8px 8px;min-height:72px;transform:translateY(0);transition:transform .35s,opacity .35s}
.vC .lchip.hide{transform:translateY(20px);opacity:0}
.vC .lchip .th{width:40px;height:56px;border-radius:4px;background:#2a3238 center/cover;flex:none}
.vC .lchip .nm{font-weight:700;font-size:14px}
.vC .lchip .mt{color:var(--muted);font-size:12px}
.vC .lchip.skel .th,.vC .lchip.skel .bar{animation:pulse .8s ease-in-out infinite}
.vC .lchip .bar{height:10px;border-radius:5px;background:#2f393e}
.vC .below{flex:1;display:flex;flex-direction:column;padding:18px 16px 40px}
.vC .brand{font-size:15px;color:var(--muted)}.vC .brand .mark{width:12px;height:17px;border-width:2px;border-radius:3px}
.vC h1{font-size:24px;line-height:1.15;font-weight:800;margin:8px 0 4px}
.vC .sub{color:var(--muted);margin:0;font-size:14px}
.vC .auth{margin-top:auto}
.vC .camcredit{position:absolute;left:14px;top:72px;z-index:5;color:rgba(255,255,255,.35)}

/* D binder wall */
.vD{background:var(--bg)}
.vD .wall{position:absolute;inset:-20px -10px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px;transform:rotate(-6deg) scale(1.12);opacity:.5}
.vD .col{display:flex;flex-direction:column;gap:10px;animation:drift 70s linear infinite}
.vD .col:nth-child(2){animation-duration:90s;animation-delay:-30s}
.vD .col:nth-child(3){animation-duration:80s;animation-delay:-55s}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.vD .tile{position:relative;aspect-ratio:488/680;border-radius:7px;background:#2a3238 center/cover;flex:none}
.vD .tile .q{position:absolute;top:5px;left:5px;height:19px;min-width:19px;padding:0 5px;border-radius:10px;background:rgba(0,0,0,.82);font-size:10px;font-weight:900;line-height:19px;text-align:center}
.vD .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,11,13,.9) 0%,rgba(8,11,13,.2) 16%,rgba(8,11,13,.25) 45%,rgba(8,11,13,.9) 62%)}
.vD .top{position:relative;z-index:2;padding:72px 20px 0}
.vD .top .brand{font-size:22px}
.vD .sheet{position:relative;z-index:3;margin-top:auto;background:var(--sheet);border-radius:12px 12px 0 0;padding:8px 16px 40px;box-shadow:0 -12px 40px rgba(0,0,0,.55)}
.vD .grab{width:36px;height:5px;border-radius:3px;background:#4a555b;margin:0 auto 14px}
.vD h1{font-size:24px;line-height:1.15;font-weight:800;margin:0 4px 6px}
.vD .sub{color:var(--muted);margin:0 4px 18px;font-size:14px}
.vD .sheetcredit{text-align:center;margin-top:8px}

/* E quiet type */
.vE{background:var(--bg);padding:0 24px}
.vE .head{margin-top:150px}
.vE .brand{font-size:56px;letter-spacing:-.03em;gap:14px}.vE .brand .mark{width:30px;height:42px;border-width:3.5px;border-radius:6px}
.vE .tag{font-size:22px;line-height:1.2;font-weight:800;color:var(--muted);margin:16px 0 0}
.vE ul{list-style:none;margin:44px 0 0;padding:0;display:flex;flex-direction:column;gap:20px}
.vE li{display:flex;gap:14px;align-items:flex-start}
.vE .ic{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none}
.vE .ic svg{width:22px;height:22px}
.vE .ft{font-weight:700;font-size:15px}
.vE .fd{color:var(--muted);font-size:13px;margin-top:2px}
.vE .bottom{margin-top:auto;padding-bottom:40px}

/* fake Recent */
.recent{background:var(--bg)}
.recent .navtitle{padding:66px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.recent h1{font-size:28px;line-height:1.1;margin:0;font-weight:800}
.recent .gear{width:36px;height:36px;border-radius:18px;background:var(--surface3);display:flex;align-items:center;justify-content:center}
.recent .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px;color:var(--muted)}
.recent .empty b{color:#fff;font-size:17px;margin-bottom:6px}
.recent .acct{margin:0 12px 10px;background:var(--surface);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted)}
.recent .acct b{display:block;color:#fff;font-size:14px}
.recent .signout{color:var(--accent);font-weight:700;font-size:15px;text-align:center;padding:6px 0 14px}
.tabbar{display:flex;justify-content:space-around;padding:6px 8px 30px;border-top:1px solid #192024;background:rgba(10,14,16,.96)}
.tabbar span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--dim);min-width:70px}
.tabbar span.sel{color:var(--accent)}
.tabbar svg{width:24px;height:24px}

/* reduced motion */
@media (prefers-reduced-motion:reduce){.v *,.v{animation:none!important;transition:none!important}}
body.rm .v *,body.rm .v{animation:none!important;transition:none!important}
body.noimg .v [style*="background-image"]{background-image:none!important}

/* prototype chrome */
#switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:4px;background:#fff;color:#111;border-radius:999px;padding:5px;box-shadow:0 8px 30px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.2);font-weight:800;font-size:13px}
#switcher button{width:34px;height:34px;border-radius:17px;background:#eee;color:#111;font-size:16px;font-weight:900}
#switcher button:hover{background:#ddd}
#switcher .label{padding:0 12px;min-width:200px;text-align:center}
#dev{position:fixed;top:14px;left:14px;z-index:100;width:270px;background:#f4f1e8;color:#1a1a1a;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:12px;overflow:hidden}
#dev .dh{background:#ffb300;color:#1a1200;padding:7px 10px;font-weight:900;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
#dev .db{padding:8px 10px;display:flex;flex-direction:column;gap:8px}
#dev.closed .db{display:none}
#dev .t{font-weight:900;font-size:11px;color:#6b5a2a;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
#dev .btns{display:flex;flex-wrap:wrap;gap:4px}
#dev button{background:#fff;border:1px solid #c9c2ad;border-radius:6px;padding:4px 7px;color:#1a1a1a;font-weight:700}
#dev button:hover{background:#fffbe9}
#dev button.sel{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
#dev pre{margin:0;background:#fff;border:1px solid #e0d8c0;border-radius:6px;padding:6px;font:11px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap}
</style>
</head>

}
function renderChrome() {
  document.getElementById('switcher-label').textContent = `${ui.variant} · ${VARIANTS[ui.variant]}`;
  document.getElementById('dev-states').innerHTML = Object.entries(STATES).map(([k, v]) => `<button data-act="setState" data-s="${k}" class="${ui.state === k ? 'sel' : ''}">${v}</button>`).join('');
  document.getElementById('dev-outcome').innerHTML = Object.entries(OUTCOMES).map(([k, v]) => `<button data-act="setOutcome" data-o="${k}" class="${ui.outcome === k ? 'sel' : ''}">${v}</button>`).join('');
  document.getElementById('dev-rm').textContent = `Reduce motion: ${ui.rm ? 'on' : 'off'}`;
  document.getElementById('dev-img').textContent = `Card images: ${ui.noimg ? 'off' : 'on'}`;
  document.getElementById('dev-state').textContent = JSON.stringify({ variant: `${ui.variant} (${VARIANTS[ui.variant]})`, state: ui.state, provider: ui.provider, tapResult: ui.outcome, lastEvent: ui.lastEvent }, null, 1);
  const p = new URLSearchParams(location.search);
  p.set('variant', ui.variant);
  if (ui.state === 'idle') p.delete('state'); else p.set('state', ui.state);
  history.replaceState(null, '', `${location.pathname}?${p}`);
}

const prevState = () => ui.state;
const ACT = {
  signIn(d) {
    if (ui.state === 'apple' || ui.state === 'google') return;
    ui.provider = d.p; ui.state = d.p; ui.lastEvent = `tap ${d.p}`;
    clearTimeout(pending);
    pending = setTimeout(() => {
      if (ui.state !== d.p) return;
      if (ui.outcome === 'ok') { ui.state = 'signedin'; ui.lastEvent = `${d.p} sign-in succeeded`; render(); }
      else if (ui.outcome === 'cancel') { ui.state = 'idle'; ui.lastEvent = `${d.p} prompt cancelled, no message`; renderAuth(); }
      else { ui.state = 'failed'; ui.lastEvent = `${d.p} sign-in failed`; renderAuth(); }
    }, 1500);
    renderAuth();
  },
  tryAgain() { ui.state = 'idle'; ui.lastEvent = 'try again'; renderAuth(); },
  signOut() { ui.state = 'idle'; ui.lastEvent = 'signed out'; render(); },
  setState(d) {
    clearTimeout(pending);
    const was = ui.state;
    if (d.s === 'cancelled') { ui.state = 'idle'; ui.lastEvent = 'cancelled: back to idle, no message'; }
    else { ui.state = d.s; ui.lastEvent = `dev: ${d.s}`; if (d.s === 'apple' || d.s === 'google') ui.provider = d.s; }
    if (was === 'signedin' || ui.state === 'signedin') render(); else renderAuth();
  },
  setOutcome(d) { ui.outcome = d.o; renderChrome(); },
  toggleRm() { ui.rm = !ui.rm; render(); },
  toggleImg() { ui.noimg = !ui.noimg; render(); },
  toggleDev() { const el = document.getElementById('dev'); el.classList.toggle('closed'); document.getElementById('devcaret').textContent = el.classList.contains('closed') ? '▸' : '▾'; },
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  ACT[el.dataset.act](el.dataset);
});
function step(n) { ui.variant = KEYS[(KEYS.indexOf(ui.variant) + n + KEYS.length) % KEYS.length]; ui.lastEvent = `variant ${ui.variant}`; render(); }
document.getElementById('prev').addEventListener('click', ev => { ev.stopPropagation(); step(-1); });
document.getElementById('next').addEventListener('click', ev => { ev.stopPropagation(); step(1); });
document.addEventListener('keydown', ev => {
  const a = document.activeElement;
  if (a && a.matches('input, textarea, select, [contenteditable]')) return;
  if (ev.key === 'ArrowLeft') step(-1);
  if (ev.key === 'ArrowRight') step(1);
});
function fit() { document.documentElement.style.setProperty('--fit', Math.min(1, (window.innerHeight - 120) / 900).toFixed(3)); }
window.addEventListener('resize', fit);
fit();
render();
</script>
</body>
</html>
