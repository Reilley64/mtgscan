<!doctype html>
<!--
PROTOTYPE, throwaway. Do not merge to main.
Question: how should the Collection tab binder grid show one tile per copy (#116, PR #119) so the owner can tell copies apart at a glance?
Plan: five radically different variants of the Collection tab in one iPhone 17 frame,
switchable with ?variant=A..E, the bottom pill, or the left and right arrow keys.
?dense=1 repeats the 24 sample copies to 120. ?img=0 hides card images.
Card images and set symbols are hard-coded Scryfall URLs (fetched once from api.scryfall.com).
-->

<style>
:root{--bg:#080b0d;--surface:#11171a;--surface2:#1a2125;--surface3:#232c31;--sheet:#161c1f;--line:#2a3238;--text:#fff;--muted:#b5c0c5;--dim:#7d8a90;--accent:#d8ff62;--on-accent:#101500;--warning:#f4d06f;--danger:#ff7a70;--info:#8fd3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#15181b;color:var(--text);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#page{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:20px 24px 120px}
#phone{zoom:var(--fit,1);position:relative;width:402px;height:874px;border-radius:58px;background:var(--bg);box-shadow:0 0 0 10px #101315,0 0 0 12px #3c4246,0 30px 90px rgba(0,0,0,.6);overflow:hidden;flex:none}
#screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 46px;font-weight:700;font-size:16px;z-index:40;pointer-events:none;background:linear-gradient(180deg,rgba(8,11,13,.95) 60%,rgba(8,11,13,0))}
.island{position:absolute;left:50%;top:11px;width:125px;height:37px;border-radius:20px;background:#000;transform:translateX(-50%)}
.sb-icons{display:flex;gap:6px;align-items:center}
.sig{display:flex;gap:2px;align-items:flex-end;height:11px}.sig i{width:3px;background:#fff;border-radius:1px}
.batt{width:25px;height:12px;border:1.5px solid rgba(255,255,255,.55);border-radius:4px;position:relative}
.batt:after{content:"";position:absolute;inset:1.5px;right:4px;background:#fff;border-radius:1.5px}
.homebar{position:absolute;bottom:8px;left:50%;width:140px;height:5px;border-radius:3px;background:#fff;transform:translateX(-50%);z-index:60;pointer-events:none}

/* app shell: large title, settings button, floating tab bar */
.navtitle{padding:62px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.navtitle h1{font-size:28px;line-height:1.1;margin:0;font-weight:800;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
.gear{width:38px;height:38px;border-radius:19px;background:var(--surface3);display:flex;align-items:center;justify-content:center}
.gear svg{width:18px;height:18px}
.tabbar{position:absolute;left:20px;right:20px;bottom:22px;height:62px;border-radius:31px;z-index:50;display:flex;align-items:center;justify-content:space-around;padding:0 6px;background:rgba(26,33,37,.62);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 10px 30px rgba(0,0,0,.45)}
.tabbar span{flex:1;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;color:var(--dim)}
.tabbar span.sel{color:var(--accent);background:rgba(255,255,255,.08)}
.tabbar svg{width:24px;height:24px}
.list-end{height:110px}

/* shared atoms */
.img{position:relative;aspect-ratio:488/680;border-radius:6px;background:var(--line);overflow:hidden;flex:none}
.img>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.img .ph{position:absolute;inset:0;padding:8px 7px;font-size:10px;font-weight:700;color:var(--muted);line-height:1.2;display:none;overflow-wrap:anywhere}
body.noimg .img>img{display:none}
body.noimg .img .ph{display:block}
.seticon{width:14px;height:14px;object-fit:contain;filter:brightness(0) invert(1);flex:none;display:block}
.seticon.muted{filter:brightness(0) invert(.78)}
.chip{height:24px;min-width:24px;padding:3px 9px;border-radius:12px;background:var(--surface3);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.c-warn{color:var(--warning)}.c-danger{color:var(--danger)}
.foiltxt{background:linear-gradient(90deg,#ff9ad5,#ffe48a,#8fffd8,#8fc7ff,#e3a6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.etchtxt{background:linear-gradient(90deg,#e8e2d0,#a9b3b8,#f6f1e2,#9aa5ab);-webkit-background-clip:text;background-clip:text;color:transparent}

/* A: current design, chip row under the card (PR #119) */
.vA .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px;padding:0 12px;align-items:start}
.vA .tile{display:flex;flex-direction:column;gap:8px}
.vA .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}

/* B: one compact meta line, foil sheen on the image */
.vB .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;padding:0 12px}
.vB .tile{display:flex;flex-direction:column;gap:5px}
.vB .meta{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;min-height:16px}
.vB .meta .dot{color:var(--dim)}
.vB .meta b{font-weight:700}
.sheen::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55;background:linear-gradient(115deg,transparent 22%,rgba(255,80,170,.55) 34%,rgba(255,230,90,.5) 42%,rgba(80,255,200,.5) 50%,rgba(80,150,255,.55) 58%,rgba(200,110,255,.5) 66%,transparent 78%);background-size:300% 300%;background-position:0% 50%;animation:sheen 5s ease-in-out infinite alternate}
.sheen.etched::after{mix-blend-mode:overlay;opacity:.6;background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.55) 42%,rgba(200,210,215,.25) 50%,rgba(255,255,255,.55) 58%,transparent 75%);background-size:300% 300%}
@keyframes sheen{to{background-position:100% 50%}}

/* C: marks on the image, nothing under the card */
.vC .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 10px}
.vC .pill{position:absolute;left:5px;bottom:5px;height:20px;padding:0 7px 0 5px;border-radius:10px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;background:rgba(8,11,13,.55);backdrop-filter:blur(8px) saturate(1.3);-webkit-backdrop-filter:blur(8px) saturate(1.3);box-shadow:0 0 0 .5px rgba(255,255,255,.18) inset}
.vC .pill .seticon{width:12px;height:12px}
.vC .cond{position:absolute;right:5px;bottom:5px;height:20px;padding:0 6px;border-radius:10px;font-size:10px;font-weight:900;display:flex;align-items:center;color:#101500}
.vC .cond.warn{background:var(--warning)}.vC .cond.danger{background:var(--danger)}
.vC .fold{position:absolute;right:0;top:0;width:30px;height:30px;clip-path:polygon(0 0,100% 0,100% 100%);background:linear-gradient(135deg,#ff9ad5,#ffe48a 35%,#8fffd8 60%,#8fc7ff);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.vC .fold.etched{background:linear-gradient(135deg,#f6f1e2,#9aa5ab 50%,#e8e2d0)}
.vC .fold b{position:absolute;right:3px;top:2px;font-size:10px;font-weight:900;color:#101500;line-height:1}

/* D: a section per printing, its copies in a horizontal row */
.vD .sec{margin:0 12px 10px;background:var(--surface);border-radius:12px;padding:10px 0 10px}
.vD .sh{display:flex;align-items:center;gap:8px;padding:0 12px 8px}
.vD .sh .nm{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vD .sh .pr{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.vD .sh .n{font-size:11px;font-weight:700;color:var(--dim);white-space:nowrap}
.vD .row{display:flex;gap:8px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.vD .row::-webkit-scrollbar{display:none}
.vD .copy{width:78px;flex:none;display:flex;flex-direction:column;gap:5px}
.vD .copy .img{border-radius:4px}
.vD .marks{display:flex;justify-content:center;gap:3px;min-height:18px}
.vD .mk{height:18px;padding:0 6px;border-radius:9px;background:var(--surface3);font-size:10px;font-weight:800;display:flex;align-items:center}
.vD .mk.nm{background:none;color:var(--dim);font-weight:700}

/* E: two columns, bigger cards, short info block */
.vE .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;padding:0 16px}
.vE .tile{display:flex;flex-direction:column;gap:7px}
.vE .img{border-radius:9px}
.vE .nm{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.vE .pr{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:-3px}
.vE .pr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vE .pr .cn{flex:none}
.vE .chips{display:flex;gap:6px;min-height:24px}
.vE .chips .none{font-size:11px;color:var(--dim);font-weight:700;align-self:center}

{"p": "isd-51", "finish": "foil", "cond": "LP"},
{"p": "mh2-186", "finish": "foil", "cond": "NM"},
{"p": "ltr-246", "finish": "foil", "cond": "NM"},
{"p": "ltr-246", "finish": "nonfoil", "cond": "HP"},
{"p": "cmr-561", "finish": "etched", "cond": "NM"},
{"p": "cmr-561", "finish": "etched", "cond": "MP"},
{"p": "mh2-138", "finish": "nonfoil", "cond": "DMG"},
{"p": "blb-241", "finish": "foil", "cond": "NM"},
{"p": "dsk-120", "finish": "nonfoil", "cond": "NM"},
{"p": "sld-1144", "finish": "foil", "cond": "MP"},
{"p": "khm-168", "finish": "nonfoil", "cond": "LP"},
{"p": "pcy-45", "finish": "nonfoil", "cond": "HP"},
{"p": "dmu-107", "finish": "nonfoil", "cond": "NM"},
{"p": "dmu-107", "finish": "nonfoil", "cond": "NM"},
{"p": "ltc-284", "finish": "nonfoil", "cond": "NM"},
{"p": "ltc-284", "finish": "nonfoil", "cond": "NM"},
{"p": "rna-22", "finish": "foil", "cond": "NM"}];

const VARIANTS = {
  A: ['Chip row (current, PR #119)', 'Optimises for: matching the shipped build, every detail as an equal chip under the card.'],
  B: ['Meta line + foil sheen', 'Optimises for: quiet chrome, the image itself says foil and one short line says the rest.'],
  C: ['Marks on the image', 'Optimises for: density, more cards per screen with the marks on the image.'],
  D: ['Grouped by printing', 'Optimises for: comparing copies of one printing side by side.'],
  E: ['Two columns with details', 'Optimises for: readable names and set names, fewer cards but no guessing.'],
};
const KEYS = Object.keys(VARIANTS);
const q = new URLSearchParams(location.search);
const ui = {
  variant: KEYS.includes(q.get('variant')) ? q.get('variant') : 'A',
  noimg: q.get('img') === '0',
  dense: q.get('dense') === '1',
  rm: false,
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const FINISH = { foil: 'Foil', etched: 'Etched' };
const condTone = c => (c === 'HP' || c === 'DMG') ? 'danger' : (c === 'LP' || c === 'MP') ? 'warn' : '';
function copies() {
  const base = COPIES.map((c, i) => ({ ...c, ...PRINTINGS[c.p], key: `${c.p}#${i}` }));
  if (!ui.dense) return base;
  const out = [];
  for (let r = 0; out.length < 120; r++) base.forEach(c => out.length < 120 && out.push({ ...c, key: `${c.key}r${r}` }));
  return out;
}
const label = c => [c.name, `${c.set} ${c.cn}`, FINISH[c.finish], c.cond !== 'NM' && c.cond].filter(Boolean).join(', ');
const setIcon = (code, cls = '') => `<img class="seticon ${cls}" src="${SETS[code].icon}" alt="${code}">`;
const image = (c, cls = '') => `<div class="img ${cls}"><img src="${c.img}" alt="" loading="lazy"><div class="ph">${esc(c.name)}</div></div>`;
const header = () => `<div class="navtitle"><h1>Collection</h1><button class="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="#fff"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.3 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button></div>`;

const V = {
  A(list) {
    return `<div class="vA">${header()}<div class="grid">${list.map(c => `
      <div class="tile" aria-label="${esc(label(c))}">${image(c)}
        <div class="chips"><span class="chip">${setIcon(c.set)}</span><span class="chip">${c.cn}</span>${c.finish !== 'nonfoil' ? `<span class="chip">${FINISH[c.finish]}</span>` : ''}${c.cond !== 'NM' ? `<span class="chip">${c.cond}</span>` : ''}</div>
      </div>`).join('')}</div><div class="list-end"></div></div>`;
  },
  B(list) {
    return `<div class="vB">${header()}<div class="grid">${list.map(c => {
      const bits = [];
      if (c.finish !== 'nonfoil') bits.push(`<b class="${c.finish === 'foil' ? 'foiltxt' : 'etchtxt'}">${FINISH[c.finish]}</b>`);
      if (c.cond !== 'NM') bits.push(`<b class="c-${condTone(c.cond)}">${c.cond}</b>`);
      return `<div class="tile" aria-label="${esc(label(c))}">${image(c, c.finish !== 'nonfoil' ? `sheen ${c.finish}` : '')}
        <div class="meta">${setIcon(c.set, 'muted')}<span>${c.cn}</span>${bits.map(b => `<span class="dot">·</span>${b}`).join('')}</div></div>`;
    }).join('')}</div><div class="list-end"></div></div>`;
  },
  C(list) {
    return `<div class="vC">${header()}<div class="grid">${list.map(c => `
      <div class="tile" aria-label="${esc(label(c))}"><div class="img"><img src="${c.img}" alt="" loading="lazy"><div class="ph">${esc(c.name)}</div>
        ${c.finish !== 'nonfoil' ? `<div class="fold ${c.finish}"><b>${c.finish === 'foil' ? '✦' : 'E'}</b></div>` : ''}
        <div class="pill">${setIcon(c.set)}${c.cn}</div>
        ${c.cond !== 'NM' ? `<div class="cond ${condTone(c.cond)}">${c.cond}</div>` : ''}
      </div></div>`).join('')}</div><div class="list-end"></div></div>`;
  },
  D(list) {
    const groups = [];
    list.forEach(c => { const g = groups[groups.length - 1]; if (g && g.p === c.p) g.copies.push(c); else groups.push({ p: c.p, copies: [c] }); });
    return `<div class="vD">${header()}${groups.map(g => {
      const p = g.copies[0];
      return `<section class="sec"><div class="sh"><span class="nm">${esc(p.name)}</span><span class="pr">${setIcon(p.set, 'muted')}${p.cn}</span><span class="n">×${g.copies.length}</span></div>
        <div class="row">${g.copies.map(c => {
          const marks = [];
          if (c.finish !== 'nonfoil') marks.push(`<span class="mk"><span class="${c.finish === 'foil' ? 'foiltxt' : 'etchtxt'}">${FINISH[c.finish]}</span></span>`);
          if (c.cond !== 'NM') marks.push(`<span class="mk c-${condTone(c.cond)}">${c.cond}</span>`);
          if (!marks.length) marks.push('<span class="mk nm">NM</span>');
          return `<div class="copy" aria-label="${esc(label(c))}">${image(c)}<div class="marks">${marks.join('')}</div></div>`;
        }).join('')}</div></section>`;
    }).join('')}<div class="list-end"></div></div>`;
  },
  E(list) {
    return `<div class="vE">${header()}<div class="grid">${list.map(c => {
      const chips = [];
      if (c.finish !== 'nonfoil') chips.push(`<span class="chip"><span class="${c.finish === 'foil' ? 'foiltxt' : 'etchtxt'}">${FINISH[c.finish]}</span></span>`);
      if (c.cond !== 'NM') chips.push(`<span class="chip c-${condTone(c.cond)}">${c.cond}</span>`);
      return `<div class="tile" aria-label="${esc(label(c))}">${image(c)}
        <div class="nm">${esc(c.name)}</div>
        <div class="pr">${setIcon(c.set, 'muted')}<span>${esc(SETS[c.set].name)}</span><span class="cn">· ${c.cn}</span></div>
        <div class="chips">${chips.join('') || '<span class="none">Nonfoil · NM</span>'}</div></div>`;
    }).join('')}</div><div class="list-end"></div></div>`;
  },
};

function render() {
  document.body.classList.toggle('noimg', ui.noimg);
  document.body.classList.toggle('rm', ui.rm);
  const list = copies();
  const screen = document.getElementById('screen');
  screen.innerHTML = V[ui.variant](list);
  screen.scrollTop = 0;
  const [name, caption] = VARIANTS[ui.variant];
  document.getElementById('switcher-label').innerHTML = `${ui.variant} · ${esc(name)}<small>${esc(caption)}</small>`;
  document.getElementById('dev-img').textContent = `Card images: ${ui.noimg ? 'off' : 'on'}`;
  document.getElementById('dev-dense').textContent = `Dense collection: ${ui.dense ? '120 copies' : 'off'}`;
  document.getElementById('dev-rm').textContent = `Reduce motion: ${ui.rm ? 'on' : 'off'}`;
  document.getElementById('dev-state').textContent = JSON.stringify({
    variant: `${ui.variant} (${name})`,
    copies: list.length,
    printings: new Set(list.map(c => c.p)).size,
    foil: list.filter(c => c.finish === 'foil').length,
    etched: list.filter(c => c.finish === 'etched').length,
    played: list.filter(c => c.cond !== 'NM').length,
    images: !ui.noimg,
  }, null, 1);
  const p = new URLSearchParams(location.search);
  p.set('variant', ui.variant);
  ui.dense ? p.set('dense', '1') : p.delete('dense');
  ui.noimg ? p.set('img', '0') : p.delete('img');
  history.replaceState(null, '', `${location.pathname}?${p}`);
}

const ACT = {
  toggleImg() { ui.noimg = !ui.noimg; render(); },
  toggleDense() { ui.dense = !ui.dense; render(); },
  toggleRm() { ui.rm = !ui.rm; render(); },
  toggleDev() { const el = document.getElementById('dev'); el.classList.toggle('closed'); document.getElementById('devcaret').textContent = el.classList.contains('closed') ? '▸' : '▾'; },
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (el) ACT[el.dataset.act]();
});
function step(n) { ui.variant = KEYS[(KEYS.indexOf(ui.variant) + n + KEYS.length) % KEYS.length]; render(); }
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));
document.addEventListener('keydown', ev => {
  const a = document.activeElement;
  if (a && a.matches('input, textarea, select, [contenteditable]')) return;
  if (ev.key === 'ArrowLeft') step(-1);
  if (ev.key === 'ArrowRight') step(1);
});
function fit() { document.documentElement.style.setProperty('--fit', Math.min(1, (window.innerHeight - 120) / 900).toFixed(3)); }
window.addEventListener('resize', fit);
fit();
render();
</script>
</body>
</html>
