<!--
PROTOTYPE, throwaway. Do not merge to main.
Question: how should the Collection tab binder grid show one tile per copy (#116, PR #119), and where should each copy's price go?
Plan: A is the PR #119 chip row baseline. B is the owner's decision (quiet meta line, static sheen) with no price.
C, D, and E add a price on top of B in three places. Switch with ?variant=A..E, the bottom pill, or the left and right arrow keys.
?dense=1 repeats the sample copies to 120. ?img=0 hides card images. ?cur=EUR shows euro prices.
Card images, set symbols, rarities, and prices are hard-coded from api.scryfall.com (fetched once, 2026-10-13).
The set symbol takes the printing's rarity colour in every variant.
Value ignores condition. The stale flag on Rhystic Study is simulated; Black Lotus has no USD price on Scryfall.
-->

.navtitle h1{font-size:28px;line-height:1.1;margin:0;font-weight:800;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}

.tabbar span.sel{color:var(--accent);background:rgba(255,255,255,.08)}

.list-end{height:110px}

/* shared atoms */
.img{position:relative;aspect-ratio:488/680;border-radius:6px;background:var(--line);overflow:hidden;flex:none}
.img>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.img .ph{position:absolute;inset:0;padding:8px 7px;font-size:10px;font-weight:700;color:var(--muted);line-height:1.2;display:none;overflow-wrap:anywhere}
body.noimg .img>img{display:none}
body.noimg .img .ph{display:block}
.seticon{width:14px;height:14px;flex:none;display:block}
.seticon svg{width:100%;height:100%;display:block;fill:currentColor}

.chip{height:24px;min-width:24px;padding:3px 9px;border-radius:12px;background:var(--surface3);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}

/* A: current design, chip row under the card (PR #119) */
.vA .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px;padding:0 12px;align-items:start}
.vA .tile{display:flex;flex-direction:column;gap:8px}
.vA .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}

/* B to E: the owner's quiet meta line and static sheen; C to E add a price */
.vB .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;padding:0 12px;align-items:start}
.vB .tile{display:flex;flex-direction:column;gap:5px;min-width:0}
.meta{--meta:rgb(186,186,186);display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--meta);white-space:nowrap;min-height:16px;min-width:0;font-variant-numeric:tabular-nums}
.meta .cn{overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta>span{flex:none}
.meta>.cn{flex:0 1 auto}
.sheen::after{content:"";position:absolute;inset:0;pointer-events:none}
.sheen.foil::after{mix-blend-mode:soft-light;opacity:.85;background:linear-gradient(125deg,rgba(255,110,190,.55) 0%,rgba(255,225,110,.5) 25%,rgba(110,255,205,.5) 50%,rgba(110,170,255,.55) 75%,rgba(205,130,255,.5) 100%)}
.sheen.etched::after{mix-blend-mode:soft-light;opacity:.8;background:linear-gradient(125deg,rgba(255,255,255,.5) 0%,rgba(170,180,186,.15) 30%,rgba(255,255,255,.55) 52%,rgba(160,170,176,.15) 74%,rgba(255,255,255,.45) 100%)}
.stale{width:11px;height:11px;flex:none;display:inline-block;vertical-align:-1px;opacity:.85}
.nop{opacity:.7}

/* C: price at the end of the meta line */
.vC .meta{gap:3px}
.vC .meta .price{flex:none;display:inline-flex;align-items:center;gap:2px}

/* D: price on its own line */
.vD .tile{gap:3px}
.vD .price{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:600;color:#e4e8ea;white-space:nowrap;min-height:17px;font-variant-numeric:tabular-nums;margin-top:-1px}

/* E: frosted price pill on the image */
.vE .ppill{position:absolute;right:4px;bottom:4px;height:18px;padding:0 6px;border-radius:9px;display:flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;max-width:calc(100% - 8px);font-variant-numeric:tabular-nums;background:rgba(14,18,20,.58);backdrop-filter:blur(8px) saturate(1.2);-webkit-backdrop-filter:blur(8px) saturate(1.2);box-shadow:0 0 0 .5px rgba(255,255,255,.2) inset}
body.noimg .vE .ppill{background:var(--surface3)}

  const v = price(c);
  const p = withPrice && (v === null ? 'no price' : `${money(v)}${c.stale ? ', may be out of date' : ''}`);
  return [c.name, `${c.set} ${c.cn}`, FINISH[c.finish], c.cond !== 'NM' && c.cond, p].filter(Boolean).join(', ');
};
const setIcon = c => `<span class="seticon r-${c.rarity}" role="img" aria-label="${c.set}, ${c.rarity}">${SETS[c.set].svg}</span>`;
const image = (c, cls = '', inner = '') => `<div class="img ${cls}"><img src="${c.img}" alt="" loading="lazy"><div class="ph">${esc(c.name)}</div>${inner}</div>`;
const sheenImage = (c, inner = '') => image(c, c.finish !== 'nonfoil' ? `sheen ${c.finish}` : '', inner);
const meta = (c, tail = '') => `<div class="meta">${setIcon(c)}<span class="cn">${c.cn}</span>${c.cond !== 'NM' ? `<span>·</span><span>${c.cond}</span>` : ''}${tail}</div>`;
const header = () => `<div class="navtitle"><h1>Collection</h1><button class="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="#fff"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.3 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button></div>`;
const quietGrid = (v, list, tile) => `<div class="vB v${v}">${header()}<div class="grid">${list.map(c =>
  `<div class="tile" aria-label="${esc(label(c, v !== 'B'))}">${tile(c)}</div>`).join('')}</div><div class="list-end"></div></div>`;

const V = {
  A(list) {
    return `<div class="vA">${header()}<div class="grid">${list.map(c => `
      <div class="tile" aria-label="${esc(label(c))}">${image(c)}
        <div class="chips"><span class="chip">${setIcon(c)}</span><span class="chip">${c.cn}</span>${c.finish !== 'nonfoil' ? `<span class="chip">${FINISH[c.finish]}</span>` : ''}${c.cond !== 'NM' ? `<span class="chip">${c.cond}</span>` : ''}</div>
      </div>`).join('')}</div><div class="list-end"></div></div>`;
  },
  B: list => quietGrid('B', list, c => sheenImage(c) + meta(c)),
  C: list => quietGrid('C', list, c => sheenImage(c) + meta(c, `<span>·</span><span class="price">${priceHtml(c, moneyShort)}</span>`)),
  D: list => quietGrid('D', list, c => sheenImage(c) + meta(c) + `<div class="price">${priceHtml(c)}</div>`),
  E: list => quietGrid('E', list, c => sheenImage(c, price(c) === null ? '' : `<div class="ppill">${priceHtml(c)}</div>`) + meta(c)),
};

function render() {
  document.body.classList.toggle('noimg', ui.noimg);
  document.body.classList.toggle('rm', ui.rm);
  const list = copies();
  const screen = document.getElementById('screen');
  screen.innerHTML = V[ui.variant](list);
  screen.scrollTop = 0;
  const [name, caption] = VARIANTS[ui.variant];
  document.getElementById('switcher-label').innerHTML = `${ui.variant} · ${esc(name)}<small>${esc(caption)}</small>`;
  document.getElementById('dev-img').textContent = `Card images: ${ui.noimg ? 'off' : 'on'}`;
  document.getElementById('dev-dense').textContent = `Dense collection: ${ui.dense ? '120 copies' : 'off'}`;
  document.getElementById('dev-rm').textContent = `Reduce motion: ${ui.rm ? 'on' : 'off'}`;
  document.getElementById('dev-cur').textContent = `Currency: ${ui.cur}`;
  document.getElementById('dev-state').textContent = JSON.stringify({
    variant: `${ui.variant} (${name})`,
    copies: list.length,
    printings: new Set(list.map(c => c.p)).size,
    foil: list.filter(c => c.finish === 'foil').length,
    etched: list.filter(c => c.finish === 'etched').length,
    played: list.filter(c => c.cond !== 'NM').length,
    currency: ui.cur,
    priced: list.filter(c => price(c) !== null).length,
    noPrice: list.filter(c => price(c) === null).length,
    stale: list.filter(c => c.stale).length,
    images: !ui.noimg,
  }, null, 1);
  const p = new URLSearchParams(location.search);
  p.set('variant', ui.variant);
  ui.dense ? p.set('dense', '1') : p.delete('dense');
  ui.noimg ? p.set('img', '0') : p.delete('img');
  ui.cur === 'EUR' ? p.set('cur', 'EUR') : p.delete('cur');
  history.replaceState(null, '', `${location.pathname}?${p}`);
}

const ACT = {
  toggleImg() { ui.noimg = !ui.noimg; render(); },
  toggleDense() { ui.dense = !ui.dense; render(); },
  toggleRm() { ui.rm = !ui.rm; render(); },
  toggleCur() { ui.cur = ui.cur === 'USD' ? 'EUR' : 'USD'; render(); },
  toggleDev() { const el = document.getElementById('dev'); el.classList.toggle('closed'); document.getElementById('devcaret').textContent = el.classList.contains('closed') ? '▸' : '▾'; },
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (el) ACT[el.dataset.act]();
});
function step(n) { ui.variant = KEYS[(KEYS.indexOf(ui.variant) + n + KEYS.length) % KEYS.length]; render(); }
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));
document.addEventListener('keydown', ev => {
  const a = document.activeElement;
  if (a && a.matches('input, textarea, select, [contenteditable]')) return;
  if (ev.key === 'ArrowLeft') step(-1);
  if (ev.key === 'ArrowRight') step(1);
});
function fit() { document.documentElement.style.setProperty('--fit', Math.min(1, (window.innerHeight - 120) / 900).toFixed(3)); }
window.addEventListener('resize', fit);
fit();
render();
</script>
</body>
</html>
