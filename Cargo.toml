[workspace]
members = ["crates/domain", "crates/application", "crates/identity", "crates/api", "crates/server", "crates/persistence"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
mtgscan-domain = { path = "crates/domain" }
mtgscan-application = { path = "crates/application" }
mtgscan-identity = { path = "crates/identity" }
mtgscan-api = { path = "crates/api" }
mtgscan-persistence = { path = "crates/persistence" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
