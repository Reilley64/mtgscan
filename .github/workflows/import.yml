name: Import

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source to import
        type: choice
        options:
          - catalog
          - prices
        default: catalog
      accept_shrink:
        description: Accept a shrink of more than 5%
        type: boolean
        default: false
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      accept_shrink:
        type: boolean
        default: false
    secrets:
      SUPABASE_SECRET_KEY:
        required: true

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: import-${{ inputs.source }}
      cancel-in-progress: false
    env:
      SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Import ${{ inputs.source }}
        working-directory: supabase
        env:
          SOURCE: ${{ inputs.source }}
          ACCEPT_SHRINK: ${{ inputs.accept_shrink }}
        run: |
          flags=()
          if [ "$ACCEPT_SHRINK" = "true" ]; then flags+=(--accept-shrink); fi
          bun run import "$SOURCE" "${flags[@]}"
