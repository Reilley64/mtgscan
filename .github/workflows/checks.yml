name: Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      database: ${{ steps.filter.outputs.database }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workspace: &workspace
              - package.json
              - bun.lock
              - bunfig.toml
              - .github/workflows/checks.yml
            app:
              - *workspace
              - apps/mobile/**
              # The @mtgscan/supabase exports that the app imports.
              - supabase/package.json
              - supabase/*.ts
              - supabase/gallery/manifest.ts
              - supabase/test-user/account.ts
            site:
              - *workspace
              - wrangler.jsonc
              - apps/site/**
              # The @mtgscan/supabase exports that the site imports.
              - supabase/package.json
              - supabase/sign-in-providers.ts
              - supabase/functions/mcp/problems.ts
            database:
              - *workspace
              - supabase/**
              # The gallery build imports the recognizer scripts.
              - apps/mobile/modules/card-recognizer/**

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run --filter @mtgscan/mobile typecheck
      - name: Lint
        run: bun run lint
      - name: Component tests
        run: bun run test
      - name: Production bundle has no test sign-in
        env:
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ci-ios-client-id.apps.googleusercontent.com
        run: bun run --filter @mtgscan/mobile test:production-bundle

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run --filter @mtgscan/site typecheck
      - name: Build the consent page
        run: bun run --filter @mtgscan/site build
      - name: Site tests
        run: bun run --filter @mtgscan/site test

  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-web-client-id,ci-ios-client-id
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-local-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run --filter @mtgscan/supabase typecheck
      - name: Start local Supabase
        run: supabase start --exclude realtime,imgproxy,mailpit,studio,logflare,vector,supavisor
      - name: Generated types match the migrations
        run: bun run types:database:check
      - name: Read the local secret key
        run: echo "SUPABASE_SECRET_KEY=$(supabase status -o json | jq -r .SECRET_KEY)" >> "$GITHUB_ENV"
      - name: Database tests
        run: bun run test:database
