name: Apple web client secret reminder

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPLE_WEB_SECRET_EXPIRES_ON: ${{ vars.APPLE_WEB_SECRET_EXPIRES_ON }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Open a renewal issue when the secret expires in fewer than 14 days
        working-directory: supabase
        run: bun run apple-web-secret:reminder
