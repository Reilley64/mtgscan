name: Release check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the search release check
        working-directory: supabase
        run: bun run release-check --report "$RUNNER_TEMP/release-check/report.md" --ungraded "$RUNNER_TEMP/release-check/ungraded-cards.jsonl"
      - name: Write the report to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release-check/report.md" ]; then
            cat "$RUNNER_TEMP/release-check/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-check
          path: ${{ runner.temp }}/release-check
          if-no-files-found: ignore
