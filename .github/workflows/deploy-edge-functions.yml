name: Deploy Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: unused-by-functions-deploy
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: unused-by-functions-deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - name: Deploy the Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
