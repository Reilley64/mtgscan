name: Daily import

on:
  schedule:
    - cron: '23 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-import
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Import prices
        run: bun run import prices
      - name: Prune search telemetry older than 180 days
        if: ${{ !cancelled() }}
        run: bun run import prune-telemetry
      - name: Retry weekly sources whose latest run failed
        if: ${{ !cancelled() }}
        run: bun run import retry-weekly
