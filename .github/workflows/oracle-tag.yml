name: Oracle tag

on:
  workflow_dispatch:
    inputs:
      action:
        description: Disable or enable the tag
        type: choice
        options:
          - disable
          - enable
        default: disable
      tag_id:
        description: Oracle tag UUID
        type: string
        required: true

permissions:
  contents: read

jobs:
  oracle-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: ${{ inputs.action }} the Oracle tag
        working-directory: supabase
        env:
          ACTION: ${{ inputs.action }}
          TAG_ID: ${{ inputs.tag_id }}
        run: bun run oracle-tag "$ACTION" "$TAG_ID"
