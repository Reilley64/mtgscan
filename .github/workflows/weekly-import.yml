name: Weekly import

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    uses: ./.github/workflows/import.yml
    with:
      source: catalog
    secrets: inherit

  oracle_tags:
    needs: catalog
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/import.yml
    with:
      source: oracle_tags
    secrets: inherit
