[tools]
rust = "1.98.1"
bun = "1.4.4"
actionlint = "1.7.12"
cloudflared = "2026.10.7"

[tasks.rust-components]
run = "rustup component add rustfmt clippy"

[tasks.native-prepare]
run = "python3 apps/native/prepare.py"

[tasks.native-unit]
run = """
set -eu
unit=$(mktemp -d "${TMPDIR:-/tmp}/mtgscan-session-unit.XXXXXX")
trap 'rm -rf "$unit"' EXIT
bun scripts/native-presentation-data.ts > "$unit/PresentationData.swift"
xcrun swiftc -warnings-as-errors apps/native/TestAppIdleTimer.swift apps/native/auth/SessionController.swift apps/native/auth/ServiceClients.swift apps/native/collection/*.swift apps/native/catalog/*.swift apps/native/components/atoms/CardSymbols.swift "$unit/PresentationData.swift" apps/native/tests/*.swift -o "$unit/tests"
"$unit/tests"
"""

[tasks.rust-check]
run = """
set -eu
cargo fmt --all --check
cargo check --workspace --all-targets --locked
cargo clippy --workspace --all-targets --locked -- -D warnings
cargo test --workspace --lib --locked
python3 scripts/check-rust-boundaries.py
"""
